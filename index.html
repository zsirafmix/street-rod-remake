function dateShort(day){const d=new Date(START_DATE.getTime()+day*86400000);return MONTHS[d.getMonth()].substr(0,3)+'. '+d.getDate()+'.';}
const RANDNAMES=['Jimmy Dean','Bobby Ray','Johnny Lee','Eddie Cole','Danny Boy','Frankie V.','Billy Joe','Ritchie','Sonny Mack','Kis Tomi','Nagy Feri','Laci'];

const WR=0.33; // wheel radius m
let UID=1;
function mkPart(id,c){return {id,c:c===undefined?100:Math.round(c)};}
function mkCar(mid,o){o=o||{};const M=MODELS[mid];const car={uid:UID++,m:mid,col:o.col||pick(M.cols),flames:0,chop:0,bump:0,axle:o.axle||3.55,timing:2,fuel:o.fuel===undefined?2:o.fuel,p:{}};
 const parts=o.parts||M.stock;SLOTS.forEach((s,i)=>{car.p[s]=parts[i]?mkPart(parts[i],o.cond!==undefined?o.cond:100):null;});return car;}
function carName(car){const M=MODELS[car.m];return M.y+' '+M.mk+' '+M.md;}
function partName(p){const d=PARTS[p.id];return d.n+(d.b!=='*'&&d.k!=='carb'&&d.k!=='tires'?' ('+BRAND[d.b]+')':'');}
function condTxt(c){return c>=95?'új':c>=75?'jó':c>=50?'használt':c>=25?'kopott':c>0?'roncs':'tönkrement';}
function partValue(p){const d=PARTS[p.id];return d.p*(0.3+0.7*p.c/100);}
function carValue(car){const M=MODELS[car.m];let v=M.base*(car.chop?1.1:1)*(car.flames?1.1:1);SLOTS.forEach(s=>{const p=car.p[s];if(p)v+=partValue(p);});return v;}
function sellCarPrice(car){return Math.round(carValue(car)*0.6/5)*5;}
function sellPartPrice(p){return Math.max(1,Math.round(PARTS[p.id].p*(0.15+0.4*p.c/100)));}
// compatibility of part p (id) for car slot given other installed parts
function fitIssue(car,id){const d=PARTS[id];const e=car.p.eng&&PARTS[car.p.eng.id];
 if(d.k==='mani'){if(!e)return'Előbb motor kell!';if(d.b!=='*'&&d.b!==e.b)return'Csak '+BRAND[d.b]+' motorhoz jó!';}
 if(d.k==='hdr'){if(!e)return'Előbb motor kell!';if(d.b!=='*'&&d.b!==e.b)return'Csak '+BRAND[d.b]+' motorhoz jó!';}
 if(d.k==='carb'){const m=car.p.mani&&PARTS[car.p.mani.id];if(!m)return'Előbb szívócső kell!';if(d.dual!==m.dual)return d.dual?'Ehhez dupla 4-torkú szívócső kell!':'Ez a szívócső két karburátort vár!';}
 if(d.k==='trans'){if(!e)return'Előbb motor kell!';if(d.b!=='*'&&d.b!==e.b)return'Csak '+BRAND[d.b]+' motorhoz jó!';}
 return null;}
// torque shape
function tqShape(u,low){const u0=0.75-0.25*low;const up=0.92;const a=1/((up-u0)*(up-u0)+2*up*(up-u0));let f=1-a*(u-u0)*(u-u0);if(u>1)f*=Math.max(0,1-(u-1)*11);return Math.max(0.05,f);}
function perf(car){const P={ok:true,miss:[],warn:[]};const pp=car.p;const M=MODELS[car.m];
 SLOTS.forEach(s=>{if(s!=='hdr'&&!pp[s])P.miss.push(KNAME[s]);});
 if(pp.eng&&pp.eng.c<=0)P.miss.push('ép motor (szétdurrant!)');if(pp.trans&&pp.trans.c<=0)P.miss.push('ép váltó (eltört!)');
 if(pp.carb&&pp.mani&&PARTS[pp.carb.id].dual!==PARTS[pp.mani.id].dual)P.miss.push('illő karburátor');
 if(P.miss.length)P.ok=false;
 const E=pp.eng?PARTS[pp.eng.id]:PARTS.e0;const ec=pp.eng?pp.eng.c:50;P.E=E;
 const C=pp.carb?PARTS[pp.carb.id]:PARTS.c1;const MA=pp.mani?PARTS[pp.mani.id]:PARTS.m1;const HD=pp.hdr?PARTS[pp.hdr.id]:null;
 const demand=E.ci*E.red*0.85/3456;const flow=C.cfm*(0.8+0.2*(pp.carb?pp.carb.c:50)/100);const r=flow/demand;
 const carbF=r>=1?(r>1.8?0.96:1):Math.pow(r,0.6);
 const tOpt=E.opt;const tf=1-0.005*(car.timing-tOpt)*(car.timing-tOpt);
 P.knock=Math.max(0,car.timing-tOpt-2);
 P.hp=E.hp*(0.55+0.45*ec/100)*carbF*MA.f*(HD?HD.f:1)*Math.max(0.5,tf);P.red=E.red;P.low=E.low;P.cyl=E.cyl;
 const rpk=0.92*E.red;P.tqMax=P.hp*5252/(rpk*tqShape(0.92,E.low));P.carbF=carbF;
 const TR=pp.trans?PARTS[pp.trans.id]:PARTS.t1;P.TR=TR;P.gears=TR.r;P.st=TR.st;P.auto=TR.auto;P.eff=TR.eff*(0.9+0.1*(pp.trans?pp.trans.c:50)/100);P.axle=car.axle;
 P.tqOver=P.tqMax>TR.mt;if(P.tqOver)P.warn.push('A motor túl erős ehhez a váltóhoz – gyorsan kopik!');if(P.knock>0)P.warn.push('Túl korai gyújtás: kopogás, motorkárosodás!');
 const TI=pp.tires?PARTS[pp.tires.id]:PARTS.r1;const tc=pp.tires?pp.tires.c:50;const tf2=0.8+0.2*tc/100;P.gd=TI.gd*tf2;P.gr=TI.gr*tf2;P.TI=TI;
 P.lbs=M.w-(car.chop?160:0)-(car.bump?90:0)+(E.cyl===8?60:E.cyl===4?-80:0)+(E.ci>400?80:0);P.mass=P.lbs*0.4536+80;
 P.cda=0.9*M.cd*(car.chop?0.9:1)*(car.bump?0.97:1);
 return P;}
function tqAt(P,rpm){return P.tqMax*tqShape(rpm/P.red,P.low);} // lb-ft
// physics state
function mkRun(P){return {x:0,v:0,gear:1,rpm:900,shift:0,blown:false,over:0,clutch:0,spin:0,pre:true,lat:0,lv:0,crashed:false,maxOver:0};}
function wheelRpm(P,S,g){return S.v/(2*Math.PI*WR)*60*P.gears[(g||S.gear)-1]*P.axle;}
function physStep(P,S,dt,thr,brk,grip){if(S.blown){thr=0;}
 if(S.pre){const tgt=900+thr*(P.red*0.98-900);S.rpm+=(tgt-S.rpm)*Math.min(1,dt*(thr>S.rpm/P.red?6:3));checkOver(P,S,dt);return;}
 const ratio=P.gears[S.gear-1];const wr=wheelRpm(P,S);let rpm;let mult=1;
 if(P.auto){const stall=1700+thr*900;rpm=Math.max(wr,stall*(S.gear===1?1:0.6),800);const sr=wr/rpm;mult=sr<0.85?1+0.9*(1-sr/0.85):1;}
 else{S.clutch=Math.max(0,S.clutch-dt*2600);rpm=Math.max(wr,S.clutch,S.gear===1?1000+thr*500:750);if(wr<rpm&&S.gear>1&&wr<600)rpm=Math.max(wr,700);}
 let tq=S.shift>0?0:tqAt(P,rpm)*thr*mult;if(S.blown)tq=0;S.shift=Math.max(0,S.shift-dt);
 let F=tq*1.3558*ratio*P.axle*P.eff/WR;const m=P.mass;const trac=(grip||P.gd)*m*9.81*0.6;S.spin=0;
 if(F>trac){S.spin=Math.min(1,(F-trac)/trac);F=trac*0.92;if(S.gear<=2&&!P.auto)rpm=Math.max(rpm,Math.min(P.red*1.05,wr*(1+S.spin*0.7)+400));}
 const drag=0.5*1.2*P.cda*S.v*S.v;const roll=S.v>0.05?0.014*m*9.81:0;
 const a=(F-drag-roll-brk*m*8.5)/(m*1.06);S.v=Math.max(0,S.v+a*dt);S.x+=S.v*dt;S.acc=a;
 S.rpm=rpm;checkOver(P,S,dt);
 if(P.auto&&S.shift<=0){if(S.rpm>P.red*0.97&&S.gear<P.gears.length){S.gear++;S.shift=P.st;}else if(S.gear>1&&wheelRpm(P,S,S.gear-1)<P.red*0.75&&thr>0.9&&S.rpm<P.red*0.45){S.gear--;S.shift=P.st;}}}
function checkOver(P,S,dt){if(S.rpm>P.red*1.02){S.over+=dt*(S.rpm-P.red*1.02)/400;S.maxOver=Math.max(S.maxOver,S.over);if(S.over>2.5||S.rpm>P.red*1.3){if(!S.blown){S.blown=true;S.blownWhy='motor';}}}else S.over=Math.max(0,S.over-dt*0.15);}
function shiftUp(P,S){if(S.blown||P.auto)return false;if(S.gear<P.gears.length){S.gear++;S.shift=P.st;return true;}return false;}
function shiftDown(P,S){if(S.blown||P.auto)return false;if(S.gear>1){S.gear--;S.shift=P.st*0.8;const nr=wheelRpm(P,S);if(nr>P.red*1.3){S.blown=true;S.blownWhy='visszakapcsolás';}else if(nr>P.red)S.over+=0.6;return true;}return false;}
// optimal upshift rpm for gear g
function optShift(P,g){if(g>=P.gears.length)return P.red;const r1=P.gears[g-1],r2=P.gears[g];let best=P.red*0.98;for(let rpm=P.red*0.6;rpm<=P.red*1.0;rpm+=50){const a=tqAt(P,rpm)*r1;const b=tqAt(P,rpm*r2/r1)*r2;if(b>=a){best=rpm;break;}}return Math.min(best,P.red*0.98);}
function bestLaunch(P){if(P.auto)return P.red*0.5;let best=2000,bt=99;for(let l=1200;l<=P.red;l+=300){const t=quickET(P,1,l,0.08);if(t<bt){bt=t;best=l;}}return best;}
function quickET(P,sk,launch,dtv){const S=mkRun(P);S.pre=false;S.rpm=launch;S.clutch=launch;const dt=dtv||1/60;let t=0;const sp=[];for(let g=1;g<=P.gears.length;g++)sp.push(optShift(P,g)-(1-sk)*700);
 while(S.x<402&&t<60){physStep(P,S,dt,1,0,P.gd);if(!P.auto&&S.shift<=0&&S.rpm>=sp[S.gear-1]&&S.gear<P.gears.length){S.gear++;S.shift=P.st+(1-sk)*0.3;}t+=dt;if(S.blown)return 60;}return t;}
function carET(car){const P=perf(car);if(!P.ok)return 99;return quickET(P,1,P.auto?P.red*0.5:Math.min(P.red*0.6,3500),1/30);}
// ---------- road track ----------
function mkTrack(seed,len){const R=srand(seed);const segs=[];let tot=0;segs.push({len:250,c:0});tot=250;
 while(tot<len-200){const st=60+R()*260;segs.push({len:st,c:0});tot+=st;const sh=R();const c=(sh<0.3?1/420:sh<0.6?1/230:sh<0.85?1/140:1/95)*(R()<0.5?-1:1);const l=80+R()*200;segs.push({len:l,c});tot+=l;if(R()<0.35){const l2=60+R()*120;segs.push({len:l2,c:-c*(0.6+R()*0.6)});tot+=l2;}}
 segs.push({len:400,c:0});let s=0;segs.forEach(g=>{g.s=s;s+=g.len;});return {segs,len:s-200,total:s,seed};}
function curveAt(T,s){for(const g of T.segs)if(s<g.s+g.len)return g.c;return 0;}
function safeV(grip,c){return c===0?999:Math.sqrt(grip*9.81*0.92/Math.abs(c));}
function speedProf(T,grip,f){T._p=T._p||{};const k=grip.toFixed(3)+'|'+f.toFixed(3);if(T._p[k])return T._p[k];const n=Math.ceil(T.total/5)+2;const v=new Float32Array(n);
 for(let i=0;i<n;i++){const c=curveAt(T,i*5);v[i]=c===0?999:safeV(grip,c)*f;}for(let i=n-2;i>=0;i--)v[i]=Math.min(v[i],Math.sqrt(v[i+1]*v[i+1]+2*7.0*5));T._p[k]=v;return v;}
function targetV(T,s,v,grip,f){const p=speedProf(T,grip,f);const i=clamp(Math.floor(s/5),0,p.length-1);return p[i];}
// full road sim (AI & estimation)
function quickRoad(P,T,sk){const S=mkRun(P);S.pre=false;S.rpm=2500;S.clutch=2500;const dt=1/20;let t=0;const f=0.82+0.13*sk;
 while(S.x<T.len&&t<400){const tv=targetV(T,S.x,S.v,P.gr,f);let thr=S.v<tv-1?1:0;if(S.rpm>P.red*0.99&&S.gear===P.gears.length)thr=0.3;const brk=S.v>tv+1?1:0;physStep(P,S,dt,thr,brk,P.gr);if(!P.auto&&S.shift<=0&&S.rpm>=optShift(P,S.gear)&&S.gear<P.gears.length){S.gear++;S.shift=P.st;}t+=dt;if(S.blown)return 400;}return t;}

function hex2rgb(h){if(h[0]!=='#')return[128,128,128];return[parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];}
function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','+Math.round(A[2]+(B[2]-A[2])*t)+')';}
function smoothPath(x,pts,tx,ty){const n=pts.length;const P=pts.map(p=>[tx(p[0]),ty(p[1]),p[2]]);x.beginPath();const m=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
 const st=P[0][2]?P[0]:m(P[n-1],P[0]);x.moveTo(st[0],st[1]);for(let i=0;i<n;i++){const v=P[i],nx=P[(i+1)%n];if(v[2]){x.lineTo(v[0],v[1]);}else{const md=m(v,nx);x.quadraticCurveTo(v[0],v[1],md[0],md[1]);}}
 if(P[0][2])x.lineTo(P[0][0],P[0][1]);x.closePath();}

function oppCar(o,gen){const c=mkCar(o.m,{parts:o.parts,col:o.col,fuel:16});c.bump=o.mods.bump?1:0;c.timing=PARTS[o.parts[0]].opt;
 if(gen>0){SLOTS.forEach(s=>{if(c.p[s])c.p[s].c=100;});}return c;}

const UPG={e0:'e1',e1:'e4',e2:'e5',e3:'e6',e4:'e8',e5:'e7',e6:'e10',e7:'e11',e8:'e12',e9:'e11',e10:'e14',e11:'e13'};
const TRANS4={G:'t7',F:'t8',C:'t9'};
function genNews(day){const R=srand(G.seed+day*7919+13);const rp=a=>a[Math.floor(R()*a.length)];const cars=[],parts=[];
 const cheap=['fa28','ch40','fo50','me49','fd32','ch40'];const mid=['ch55','ch57','tb56','pl58','fo60','pc62','fd32','me49'];const hi=['im62','dd62','cv56','pc62','fo60','ch57'];
 const nC=8;for(let i=0;i<nC;i++){const m=i<3?rp(cheap):i<6?rp(mid):rp(hi);const M=MODELS[m];const cond=20+R()*70;
  const parts=M.stock.slice();const notes=[];let broken=0;
  const r=R();if(i>0&&i<3&&r<0.35){parts[R()<0.5?1:0]=null;broken=1;}
  if(R()<0.25&&parts[0]&&UPG[parts[0]]&&i>=2){const ne=UPG[parts[0]];parts[0]=ne;const b=PARTS[ne].b;if(PARTS[parts[2]].b!=='*'&&PARTS[parts[2]].b!==b)parts[2]='m1';if(PARTS[parts[4]].b!=='*'&&PARTS[parts[4]].b!==b)parts[4]=({G:'t1',F:'t2',C:'t3'})[b];notes.push('Erősebb motor!');}
  if(R()<0.2&&parts[0]){const b=PARTS[parts[0]].b;parts[4]=TRANS4[b];notes.push('4-seb.');}
  if(R()<0.15&&parts[0]&&!broken){const b=PARTS[parts[0]].b;parts[3]=({G:'h1',F:'h2',C:'h3'})[b];notes.push('Leömlők.');}
  if(R()<0.3)parts[5]=rp(['r1','r2','r3']);
  const car=mkCar(m,{parts,cond:Math.round(cond),fuel:1,col:rp(M.cols)});if(car.p.tires)car.p.tires.c=Math.round(30+R()*70);
  if(R()<0.1){car.flames=1;notes.push('Lángfestés!');}
  const P=perf(car);let d=(cond>75?'Szép állapotban.':cond>50?'Jól megy.':cond>30?'Rozsdás, de megy.':'Lestrapált.');
  if(!P.ok){d='Nem indul! Hiányzik: '+P.miss.join(', ')+'.';}
  if(car.p.eng)d+=' '+PARTS[car.p.eng.id].n.replace(/^(Chevy|Ford|Chrysler|Pontiac) /,'')+'.';
  d+=' '+notes.join(' ');
  const price=Math.max(100,Math.round(carValue(car)*(0.85+R()*0.3)/5)*5);cars.push({id:'c'+day+'_'+i,car,desc:d.trim(),price});}
 cars.sort((a,b)=>a.price-b.price);
 const ids=Object.keys(PARTS);for(let i=0;i<14;i++){let id;do{id=rp(ids);}while(PARTS[id].p>300*(1+day*0.35)&&R()<0.85);
  const nw=R()<0.5;const c=nw?100:Math.round(40+R()*45);const price=Math.max(5,Math.round(PARTS[id].p*(nw?(0.95+R()*0.15):(0.3+0.6*c/100)*(0.85+R()*0.3))));parts.push({id:'p'+day+'_'+i,part:mkPart(id,c),price});}
 parts.sort((a,b)=>PARTS[a.part.id].k.localeCompare(PARTS[b.part.id].k)||a.price-b.price);
 const head=HEADLINES[day]||GENHEAD[Math.floor(R()*GENHEAD.length)];
 return {cars,parts,head};}
let NEWS=null;
function news(){if(!NEWS||NEWS.day!==G.day||NEWS.seed!==G.seed){NEWS=genNews(G.day);NEWS.day=G.day;NEWS.seed=G.seed;}const b=G.bought[G.day]||[];return {head:NEWS.head,cars:NEWS.cars.filter(c=>!b.includes(c.id)),parts:NEWS.parts.filter(c=>!b.includes(c.id))};}
function markBought(id){(G.bought[G.day]=G.bought[G.day]||[]).push(id);for(const k in G.bought)if(+k<G.day-1)delete G.bought[k];}
function nextDay(){G.day++;for(const id in G.opp){const o=G.opp[id];if(o.away>=0&&G.day>=o.away){o.away=-1;o.gen++;o.car=oppCar(OPPS.find(x=>x.id===id),o.gen);}}save();}
function invValue(){return G.inv.reduce((a,p)=>a+sellPartPrice(p),0);}
function isGameOver(){if(G.cars.length)return false;const n=news();const cheapest=n.cars.length?Math.min(...n.cars.map(c=>c.price)):150;return G.money+invValue()<Math.min(cheapest,150);}
